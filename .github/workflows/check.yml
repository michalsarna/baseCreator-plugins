name: Check plugins
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which baseCreator
        id: base
        run: echo "tag=$(cat .baseCreator-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: michalsarna/baseCreator
          ref: ${{ steps.base.outputs.tag }}
          path: baseCreator
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: baseCreator
      - name: Run the scripts of every plugin
        run: cargo run --release --manifest-path baseCreator/Cargo.toml -p base-core --example check_plugins -- plugins
      - name: Build the list (a changed plugin must have a new version)
        run: python3 tools/build_site.py --out site --published https://michalsarna.github.io/baseCreator-plugins/index.json
