name: Publish the list
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Which baseCreator
        id: base
        run: echo "tag=$(cat .baseCreator-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: michalsarna/baseCreator
          ref: ${{ steps.base.outputs.tag }}
          path: baseCreator
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: baseCreator
      - name: Run the scripts of every plugin
        run: cargo run --release --manifest-path baseCreator/Cargo.toml -p base-core --example check_plugins -- plugins
      - name: Build the site
        run: python3 tools/build_site.py --out site --published https://michalsarna.github.io/baseCreator-plugins/index.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
