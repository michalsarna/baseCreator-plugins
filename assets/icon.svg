<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="512" cy="330" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5620f"/>
      <stop offset="0.45" stop-color="#f5620f"/>
      <stop offset="1" stop-color="#cf530d"/>
    </radialGradient>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8d949c"/>
      <stop offset="0.35" stop-color="#eef1f4"/>
      <stop offset="0.7" stop-color="#b9c0c7"/>
      <stop offset="1" stop-color="#6f767e"/>
    </linearGradient>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset="0.55" stop-color="#d9dde1"/>
      <stop offset="1" stop-color="#a3aab1"/>
    </linearGradient>
    <linearGradient id="boot" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9aa1a8"/>
      <stop offset="0.4" stop-color="#e3e6e9"/>
      <stop offset="1" stop-color="#868d94"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1024" height="1024" rx="225"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect y="735" width="1024" height="289" fill="#241808"/>
    <rect y="735" width="1024" height="1" fill="#7f4317"/>
    <rect y="736" width="1024" height="3" fill="#5a3a1a"/>
    <!-- the cable going down into the dark floor -->
    <path d="M512 640 L512 700 C512 780 512 840 512 1024" fill="none" stroke="#130d04" stroke-width="86" stroke-linecap="butt" opacity="0.55" transform="translate(10 8)"/>
    <path d="M512 640 L512 1024" fill="none" stroke="#d9dde1" stroke-width="76"/>
    <path d="M482 640 L482 1024" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.5"/>
    <!-- the plug: two pins, the body, the boot -->
    <g>
      <rect x="392" y="170" width="62" height="250" rx="14" fill="#130d04" opacity="0.35" transform="translate(12 10)"/>
      <rect x="570" y="170" width="62" height="250" rx="14" fill="#130d04" opacity="0.35" transform="translate(12 10)"/>
      <rect x="392" y="170" width="62" height="250" rx="14" fill="url(#steel)"/>
      <rect x="570" y="170" width="62" height="250" rx="14" fill="url(#steel)"/>
      <rect x="392" y="170" width="62" height="34" rx="14" fill="#6f767e" opacity="0.55"/>
      <rect x="570" y="170" width="62" height="34" rx="14" fill="#6f767e" opacity="0.55"/>
      <rect x="320" y="388" width="384" height="262" rx="78" fill="#130d04" opacity="0.35" transform="translate(14 14)"/>
      <rect x="320" y="388" width="384" height="262" rx="78" fill="url(#body)"/>
      <rect x="336" y="404" width="352" height="230" rx="64" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.7"/>
      <rect x="440" y="628" width="144" height="58" rx="16" fill="url(#boot)"/>
      <!-- grip lines -->
      <rect x="400" y="470" width="224" height="14" rx="7" fill="#9aa1a8" opacity="0.75"/>
      <rect x="400" y="510" width="224" height="14" rx="7" fill="#9aa1a8" opacity="0.75"/>
      <rect x="400" y="550" width="224" height="14" rx="7" fill="#9aa1a8" opacity="0.75"/>
    </g>
  </g>
</svg>
